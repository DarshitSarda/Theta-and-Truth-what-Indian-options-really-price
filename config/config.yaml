# Sprint 1 daily collection universe (expand over time; full watchlist stays above)
collection:
  active_symbols:
    - NIFTY
    - BANKNIFTY

# Scraping
scraping:
  headless: false
  page_load_timeout: 30
  api_timeout: 20
  delay_between_requests: 0.8
  max_retries: 3
  # NSE structure (post Nov 2024): NIFTY = weekly (Tue); other indices = monthly
  # NSE lists ~6 weeklies before the first monthly, so 3 expiries only reach
  # ~19 DTE and cmt30 clamps to the last node. 6 keeps a >=35 DTE node listed
  # across the whole expiry cycle so cmt30 interpolates.
  nifty_weekly_expiries: 6
  monthly_index_expiries: 2
  equity_expiries: 1
  equity_roll_days_before_expiry: 5
  # Dataset B (later): ATM band + top movers; not wired in sprint 1
  atm_strike_band: 5
  intraday_strike_cap: 40
  strikes_around_atm: 10

paths:
  download_dir: data/raw
  nse_reports: data/raw/nse_reports

logging:
  level: INFO
  file: logs/scraper.log
